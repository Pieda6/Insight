artifacts = ["/app/output/"]

schema_version = "2.0"

[task]
name = "insight/bridge-load-planning"
description = "Place heavy pallets on tractor-trailers so every truck is legal under the federal axle and Bridge Formula limits (23 CFR 658.17), using the fewest trucks."

[metadata]
difficulty_explanation = "Legality depends on where each pallet sits and where the trailer tandem is slid, not just on total weight: trailer load splits between kingpin and trailer tandem by lever balance and the kingpin load splits again between steer and drive tandem. Near full payload the legal centre of gravity is a window only a few inches wide whose location depends on the slider setting, while the minimum plan also needs most of each trailer floor, so pallet order and slider choice decide whether a set of pallets can be loaded at all; packing by weight and floor length and then arranging pallets fails repeatedly. The Bridge Formula must hold for every group of two or more consecutive axles, and on short-rail units the drive-plus-trailer-tandem group (axles 2-5) binds below the gross limit. Forward-only units sit at 35.5 to 37 ft between those tandems, where only the 34,000 + 34,000 lb two-tandem allowance and half-up foot rounding give them full capacity. The freight is sized so the minimum truck count is reachable only with all rules applied exactly: missing the allowance, flooring the span, checking only the whole truck, or loading heaviest-first each produce an extra truck or an illegal truck. Data are synthetic but follow real tractor geometry, tare weights and dense freight (coils, machinery, transformers, paper)."
solution_explanation = "Every axle load is linear in a trailer payload W and its first moment M about the front wall, so for each unit and slider setting the legal M for a given W is an interval and the largest legal W is that configuration's capacity. The fewest units whose capacities cover the freight is a lower bound on the truck count. Pack the pallets onto that many units with CP-SAT, choosing slider settings, with weight and floor-length limits and the centre-of-gravity reachability bounds from densest-first packing (Smith's rule: the extreme moments of a pallet set are sum w*len + 2*sum over pairs of min(w_i*len_j, w_j*len_i) from either wall); then give each truck exact integer positions with a small no-overlap CP-SAT model, cutting off any truck set that cannot be placed. The first feasible packing at the lower bound is optimal."
verification_explanation = "The verifier never runs agent code. From its own copy of the inputs it recomputes every axle load pallet by pallet with exact fractions (an implementation independent of the reference solution, cross-checked on thousands of random loads) and checks: every pallet assigned once to a real unit; units.csv lists exactly the loaded units with one of their own slider settings; pallets fit inside the trailer without overlap; steer <= 20,000 lb, each tandem <= 34,000 lb, gross <= 80,000 lb; the Bridge Formula on all ten consecutive axle groups with the stated rounding and the two-tandem allowance; the number of units equals the proven minimum (9: the weight lower bound, achieved by the reference plan); summary units_used is consistent; and reported axle loads are within 1 lb of the exact values. Any legal minimum plan is accepted. Reward is 1 only if all tests pass."
category = "Operations"
subcategory = "Logistics"
tags = ["trucking", "load-planning", "bridge-formula", "23-cfr-658", "axle-weights", "bin-packing", "optimization", "python"]
expert_time_estimate_hours = 7
relevant_experience = "Freight load planning and truck size-and-weight compliance for heavy commodities (steel, machinery, paper), including axle-weight distribution, sliding-tandem settings and Federal Bridge Formula checks for tractor-semitrailer combinations."

[verifier]
