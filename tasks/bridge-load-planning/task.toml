artifacts = ["/app/output/"]

schema_version = "2.0"

[task]
name = "insight/bridge-load-planning"
description = "Place heavy pallets on tractor-trailers so every truck is legal under federal Interstate weight law (23 U.S.C. 127, 23 CFR 658.17), including idle-reduction allowances, using the fewest trucks."

[metadata]
difficulty_explanation = "The instruction cites 23 U.S.C. 127 and 23 CFR 658.17 but does not restate their numbers, so the solver must know or look up the law and apply it exactly. Most tractors carry an idle-reduction unit (APU). The regulation (658.17(n), last amended 2007) still allows up to 400 lb for it, but the statute (127(a)(12), as amended in 2015) raises every limit by the APU's weight up to 550 lb, and only when the operator can prove the unit is fully functional. The correct allowance is therefore min(certified weight, 550) for a functional APU and zero otherwise; the freight is sized so the minimum truck count is reachable only with exactly that, while 400 lb or no allowance needs an extra truck and a flat 550 lb, an uncapped certified weight, or counting an inoperative APU overloads trucks. On top of that, legality depends on where each pallet sits and where the trailer tandem is slid (lever balance from trailer to kingpin to steer and drive tandem), the Bridge Formula applies to every consecutive axle group, and forward-slider units only reach full capacity with the 34,000 + 34,000 lb two-tandem provision and half-up foot rounding. Data are synthetic but follow real tractor geometry, tare weights, APU certifications and dense freight."
solution_explanation = "Determine each unit's allowance from the statute: min(certified APU weight, 550 lb) when the APU is certified fully functional, else 0, added to every axle, tandem, gross and Bridge Formula limit. Every axle load is linear in a trailer's payload W and its first moment M about the front wall, so for each unit and slider setting the legal M for a given W is an interval and the largest legal W is that configuration's capacity. The fewest units whose capacities cover the freight is a lower bound on the truck count. Pack the pallets onto that many units with CP-SAT (weight, floor length, and densest-first reachability of the centre-of-gravity window), then give each truck exact integer positions with a small no-overlap model, cutting off any truck set that cannot be placed. The first feasible packing at the lower bound is optimal."
verification_explanation = "The verifier never runs agent code. From its own copy of the inputs it recomputes every axle load pallet by pallet with exact fractions (an implementation independent of the reference solution, cross-checked on thousands of random loads) and checks: every pallet assigned once to a real unit; units.csv lists exactly the loaded units with one of their own slider settings; pallets fit inside the trailer without overlap; each axle <= 20,000 lb, each tandem <= 34,000 lb, gross <= 80,000 lb and the Bridge Formula on all ten consecutive axle groups with the stated rounding and the two-tandem provision, every limit raised by the unit's statutory idle-reduction allowance (min(certified weight, 550) for a functional APU, else 0); the number of units equals the proven minimum (9: the weight lower bound, achieved by the reference plan); summary units_used is consistent; and reported axle loads are within 1 lb of the exact values. Any legal minimum plan is accepted. Reward is 1 only if all tests pass."
category = "Operations"
subcategory = "Logistics"
tags = ["trucking", "load-planning", "bridge-formula", "23-usc-127", "23-cfr-658", "idle-reduction", "axle-weights", "optimization", "python"]
expert_time_estimate_hours = 7
relevant_experience = "Freight load planning and truck size-and-weight compliance for heavy commodities (steel, machinery, paper), including axle-weight distribution, sliding-tandem settings and Federal Bridge Formula checks for tractor-semitrailer combinations."

