artifacts = ["/app/output/"]

schema_version = "2.0"

[task]
name = "insight/cobra-claims-review"
description = "Adjudicate a COBRA administrator's claims queue: for 2,885 medical claims from 417 people offered COBRA in 214 families, decide whether each date of service falls inside COBRA continuation coverage under 26 CFR 54.4980B, across maximum coverage periods, the disability extension, second qualifying events, Medicare, FMLA leave, waivers, elections, premium payments and early termination."

[metadata]
difficulty_explanation = "COBRA administrators decide every claim from a former plan member against the person's whole coverage history under 26 CFR 54.4980B, and the provisions that decide it change each other. The maximum coverage period of 54.4980B-7 Q&A-4 depends on the first qualifying event, and the disability extension of Q&A-5, the second qualifying events of Q&A-6 and the Medicare rule of Q&A-7 each change it for some members of a family and not others. The disability extension also changes which later events count as second qualifying events and which months carry the higher premium of 54.4980B-8 Q&A-1. The records are what an administrator receives, not a summary: a termination recorded after FMLA leave carries its qualifying event on another date under 54.4980B-10, a waiver followed by an election changes when coverage starts under 54.4980B-6 Q&A-4, a 26th birthday is not a qualifying event for a child the plan keeps covering, and an employee's Medicare entitlement or a later termination may not be a qualifying event at all. Coverage also turns on the election period of 54.4980B-6, the premium timing and shortfall rules of 54.4980B-8 Q&A-5 with the plan's shortfall notices, and the early termination events of 54.4980B-7 Q&A-1 to Q&A-3 for every family member. The 2,885 claims sit at the boundaries of these rules (a day either side of each deadline, a cent either side of each shortfall margin, a month either side of each period), so one misread provision changes some answers."
solution_explanation = "The reference solution models each qualified beneficiary's COBRA continuation coverage as 26 CFR 54.4980B defines it, with the plan choices stated in the instruction. It finds each family's first qualifying event and its date (54.4980B-10 for FMLA leave) and the start of coverage, tests the election against 54.4980B-6 including revoked waivers, and sets the maximum coverage period from 54.4980B-7 Q&A-4 to Q&A-7 (disability extension, second qualifying events with the plan's eligibility terms, Medicare before a termination). It applies the early termination events of Q&A-1 to Q&A-3, then checks each month's premium against 54.4980B-8 (applicable premium of the calendar year, the 102% and 150% limits, timely payment and the first-payment period, the shortfall margin and shortfall notices). Premiums are decimals rounded half up. A claim is covered when its date of service falls inside the resulting coverage."
verification_explanation = "The verifier recomputes every claim with its own independently written engine (engine.py, which decides each claim on its own with day arithmetic and exact fractions, while the reference solution works in month indexes with decimals) from a private copy of the inputs that exists only in the verifier image, and never runs agent code. The engine is checked against 114 hand-worked planted claims (golden.json), and the generator's own third implementation reproduces the same answers for all 2,885 claims. Tests check that the inputs are consistent, the exact header, one row per claim in input order, the value format, the hand-worked claims, one test per rule family (maximum periods, election, premium payment, disability extension, second qualifying events, Medicare, early termination, FMLA leave, waivers, children kept on the plan) and finally every row by exact match. Reward is 1 only if every test passes."
category = "Operations"
subcategory = "Claims"
tags = ["cobra", "26-cfr-54-4980b", "fmla", "benefits-administration", "continuation-coverage", "claims", "health-plan", "python"]
expert_time_estimate_hours = 8
relevant_experience = "COBRA administration and health plan claims adjudication: maximum coverage periods, disability extensions, second qualifying events, election periods, premium grace periods and shortfalls, and early termination under 26 CFR 54.4980B."

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[agent]
