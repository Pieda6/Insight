artifacts = ["/app/output/"]

schema_version = "2.0"

[task]
name = "insight/vancomycin-hemodialysis-monitoring"
description = "Vancomycin dosing by predialysis-concentration monitoring for 150 patients on maintenance hemodialysis (1,651 sessions) under the 2020 ASHP/IDSA/PIDS/SIDP guideline: loading and maintenance doses from Recommendation 13 by dialyzer permeability and dose timing, the guideline's hemodialysis sampling rule for which levels count, and a session-by-session chain in which weight-based doses give way to level-driven proportional changes that carry every decision forward, from laboratory records in mg/L or umol/L with corrected results and New York local times."

[metadata]
domain = "Science"
field = "Medicine"
subfield = "Clinical Pharmacology and Therapeutic Drug Monitoring"
tags = ["pharmacokinetics", "therapeutic-drug-monitoring", "vancomycin", "hemodialysis", "nephrology", "clinical-pharmacy", "python"]
expert_time_estimate_hours = 6
relevant_experience = "Clinical pharmacy in nephrology and dialysis: vancomycin dosing for patients on hemodialysis under the 2020 consensus guideline, predialysis concentration monitoring, dialyzer permeability and intradialytic dosing, and reading dialysis unit and laboratory records."

