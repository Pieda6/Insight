artifacts = ["/app/output/"]

schema_version = "2.0"

[task]
name = "insight/hazmat-trailer-check"
description = "Pre-departure hazmat check for a freight carrier's trailers: decide the exact placards each trailer must display and which package pairs violate highway segregation under 49 CFR 172.500-172.505 and 177.848."

[metadata]
difficulty_explanation = "Dock and dispatch staff at every hazmat carrier make this check daily, and the answer turns on details of the Hazardous Materials Regulations that are easy to get wrong. Placarding: some classes need a placard in any quantity while others only once the vehicle's aggregate is not less than 1,001 lb; limited quantities, non-bulk combustible liquids and residue-only packages do not count; the DANGEROUS placard replaces separate placards except for a category with 2,205 lb or more loaded at one facility; 172.504(f) removes placards (lowest explosives division only, no NON-FLAMMABLE GAS with FLAMMABLE GAS, no OXIDIZER with EXPLOSIVES 1.1/1.2/1.5, no POISON INHALATION HAZARD under POISON GAS, no POISON under either, no CLASS 9 domestically); 172.505 adds POISON INHALATION HAZARD and DANGEROUS WHEN WET for subsidiary hazards and takes those materials out of the 1,001 lb exception; only Yellow III radioactive packages need a placard. Segregation: the 177.848 table distinguishes zone A and B gases, PG I zone A poison liquids and corrosive liquids only; 'O' allows separated loading but corrosive liquids may still not sit adjacent to Class 4 or 5; subsidiary hazards apply unless both materials are of the same class; cyanides may not travel with acids; note A lets ammonium nitrate ride with 1.1 and 1.5; unlabeled packages are outside the section; explosives follow the compatibility table and its notes on fireworks and explosive substances. Each shortcut gets most trailers right and a planted set wrong. The data is synthetic but follows real commodities, UN numbers and a carrier's daily dispatch."
solution_explanation = "For each trailer, drop packages excepted from placarding (limited quantity, non-bulk combustible liquid, residue-only table 2 packages). Add table 1 placards for any quantity, and RADIOACTIVE only for Yellow III. Sum table 2 gross weight; if it is at least 1,001 lb every table 2 category needs its placard, otherwise only those subject to 172.505. Add 172.505 POISON INHALATION HAZARD and DANGEROUS WHEN WET. Apply the 172.504(f) exceptions, then replace the remaining table 2 placards with DANGEROUS when two or more remain, keeping any category with 2,205 lb or more loaded at a single facility. For segregation, check every pair of labeled packages: cyanide with acid; each primary and (unless same class) subsidiary hazard against the 177.848(d) table, honouring note A, 'O' separation by bay and the corrosive-liquid adjacency rule; explosives pairs against the compatibility table with notes 2, 3, 5 and 6."
verification_explanation = "The verifier recomputes every trailer with its own independently written engine (engine.py, its own transcription of the segregation and compatibility tables, cross-checked by symmetry) from a private copy of the inputs that exists only in the verifier image, and never runs agent code. The engine is itself checked against 74 hand-worked planted trailers (golden.json). Tests check the exact header, one row per trailer in input order, value formats, the hand-worked cases, one test per rule family (weight threshold and excepted materials, any-quantity placards, DANGEROUS and the single-facility rule, 172.504(f) exceptions, subsidiary placards, segregation table, explosives) and finally every row by exact match. Reward is 1 only if every test passes."
category = "Operations"
subcategory = "Logistics"
tags = ["hazmat", "49-cfr-172", "49-cfr-177", "placarding", "segregation", "trucking", "dispatch", "python"]
expert_time_estimate_hours = 6
relevant_experience = "Hazmat compliance or dispatch for a motor carrier: 49 CFR Part 172 subpart F placarding (tables 1 and 2, DANGEROUS, 172.504(f) exceptions, 172.505) and 49 CFR 177.848 segregation including the Class 1 compatibility table."

