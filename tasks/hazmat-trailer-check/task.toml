artifacts = ["/app/output/"]

schema_version = "2.0"

[task]
name = "insight/hazmat-trailer-check"
description = "Pre-departure hazmat check for a chemical distributor's trailers: classify its own blends from lab data under 49 CFR 173.2a and 173.115-173.150, then decide the exact placards each trailer must display and which package pairs violate highway segregation under 49 CFR 172.500-172.505 and 177.848."

[metadata]
difficulty_explanation = "A chemical distributor's dispatch desk checks every outbound hazmat trailer, and many of the packages are the company's own blends with no classification on record, only lab data. Each blend has to be classified first: flash point (some in Fahrenheit) and initial boiling point decide Class 3 and its packing group, but 173.120(a)(2) to (a)(5) take out mixtures whose high flash components make up 99 percent, liquids that do not sustain combustion, have a fire point above 100 C or are over 90 percent water, each only above 35 C; a liquid heated to its flash point in a bulk packaging is Class 3 whatever its flash point; the carrier reclasses every flammable liquid at or above 38 C with no other hazard as combustible, which takes it out of the regulations in non-bulk packagings, and 173.150(f)(4) and 173.120(b)(3) remove some combustible liquids altogether. Division 6.1 needs the packing group from the most toxic route, four-hour LC50 values converted, the saturated vapor concentration worked out from vapor pressure (some in mmHg) or, for mixtures, the LC50 and volatility formulas of 173.133(b), and hazard zone A or B decides poison inhalation hazard status and segregation. Class 8 turns on the skin exposure time (3, 60 and 240 minutes) or a corrosion rate above 6.25 mm a year on either metal, for liquids or solids that may liquefy. Gases turn on the 13 percent and 12 point flammability tests, 200 kPa gauge (some in psig), LC50 limits and the mixture formula. Blends with two hazards follow the 173.2a order (poison inhalation hazard and pyrophoric first) and the precedence table with its pesticide footnote and Note 2, keep the most severe packing group, and every labeled subsidiary hazard then counts for segregation. The result then feeds the placarding rules (1,001 lb aggregate, DANGEROUS and the 2,205 lb single-facility rule, 172.504(f) exceptions, 172.505 subsidiary placards, bulk packagings under 171.8, uranium hexafluoride) and 177.848 segregation (zones, the O and adjacency rules, cyanides with acids, note A, explosives compatibility). Each shortcut gets most trailers right and a planted set wrong. The data is synthetic but follows real commodities, UN numbers, lab reports and a distributor's daily dispatch."
solution_explanation = "Classify each house blend from its lab data: gases by 173.115 (flammability limits, pressure, LC50 or the mixture formula, zone from 173.116, OXIDIZER and FLAMMABLE GAS subsidiary labels from 172.402(f) and (g)); liquids for Class 3 under 173.120 and 173.121 with the (a)(2) to (a)(5) exclusions and the elevated temperature rule, then the combustible reclass and the 173.150(f)(4) and 173.120(b)(3) exclusions; Division 6.1 by 173.132 and 173.133 (worst route, four-hour conversions, V from vapor pressure, mixture LC50 and R); Class 8 by 173.137. Rank two hazards by 173.2a (poison inhalation hazard, then pyrophoric, then the precedence table with Note 2 and the pesticide footnote), keep the most severe packing group, and label each subsidiary hazard. Then, for each trailer, drop packages excepted from placarding (limited quantity, non-bulk combustible liquid, residue-only table 2 packages). Add table 1 placards for any quantity, and RADIOACTIVE only for Yellow III. Decide which packagings are bulk under 171.8; bulk table 2 materials (and bulk combustible liquid) need their placard in any quantity. Sum non-bulk table 2 gross weight; if it is at least 1,001 lb every non-bulk table 2 category needs its placard, otherwise only those subject to 172.505. Add CORROSIVE and POISON for 1,001 lb or more of uranium hexafluoride. Add 172.505 POISON INHALATION HAZARD and DANGEROUS WHEN WET. Apply the 172.504(f) exceptions, then replace the remaining non-bulk table 2 placards with DANGEROUS when two or more non-bulk categories are placarded, keeping any category with 2,205 lb or more loaded at a single facility. For segregation, check every pair of labeled packages: cyanide with acid; each primary and (unless same class) labeled subsidiary hazard against the 177.848(d) table, honouring note A, 'O' separation by bay and the corrosive-liquid adjacency rule; explosives pairs against the compatibility table with notes 2, 3, 5 and 6."
verification_explanation = "The verifier recomputes every trailer with its own independently written engine (engine.py, its own transcription of the precedence, segregation and compatibility tables, cross-checked against the reference cell by cell) from a private copy of the inputs that exists only in the verifier image, and never runs agent code. The engine is itself checked against 163 hand-worked planted trailers (golden.json). Tests check the exact header, one row per trailer in input order, value formats, the hand-worked cases, one test per rule family (weight threshold and excepted materials, any-quantity placards, DANGEROUS and the single-facility rule, 172.504(f) exceptions, subsidiary placards, segregation table, explosives, bulk packagings, uranium hexafluoride, and for house blends: flammable and combustible liquids, multiple-hazard precedence, toxicity, corrosivity, gases, subsidiary labels) and finally every row by exact match. Reward is 1 only if every test passes."
category = "Operations"
subcategory = "Logistics"
tags = ["hazmat", "49-cfr-172", "49-cfr-173", "49-cfr-177", "classification", "placarding", "segregation", "dispatch", "python"]
expert_time_estimate_hours = 8
relevant_experience = "Hazmat compliance for a chemical distributor or motor carrier: classifying mixtures from lab data under 49 CFR 173 subpart D and 173.2a, 172.402 subsidiary labels, Part 172 subpart F placarding (tables 1 and 2, DANGEROUS, 172.504(f) exceptions, 172.505) and 49 CFR 177.848 segregation including the Class 1 compatibility table."

