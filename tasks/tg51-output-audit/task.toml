description = "Independent review of annual linac output calibrations under AAPM TG-51 (Med Phys 1999;26:1847) and its 2014 photon addendum for 138 photon and electron beams at twelve clinics: from raw chamber readings, depth scans with and without lead foil, chamber-axis profiles and clinical depth-dose data, the dose per MU at the reference point and at dmax, with flattening-filter-free beams, SAD and SSD set-ups and cross-calibrated plane-parallel chambers."

