artifacts = ["/app/output/"]

schema_version = "2.0"

[task]
name = "insight/va-compensation-awards"
description = "Audit a VA regional office's disability compensation awards: for 160 veterans and every month from January 2023 to September 2026, compute the combined disability rating and the compensation paid under 38 CFR Parts 3 and 4, across effective dates of original and increased ratings, the combined ratings table and bilateral factor, payment start, dependents, December rate changes and recovery of separation pay."

[metadata]
difficulty_explanation = "VA awards staff fix the amount of every monthly compensation payment from a veteran's whole claims history, and the provisions that decide it change each other. The effective date of each rating depends on the kind of claim and its dates under 38 CFR 3.400(b)(2) and 3.400(o)(2), and payment at a new rate starts later than the effective date under 3.31. The combined rating comes from the combined ratings table of 4.25, and 4.26 changes how disabilities of the arms and legs enter it depending on which limbs and sides are compensable on that day, so a single new or increased rating on one limb can change the rating of the whole award. Additional amounts for dependents depend on the combined rating (3.4(b)(2)) and on when each marriage or birth was reported (3.401(b)), the rate tables change every December 1, and nondisability separation pay is recovered from compensation under 3.700(a)(5) from the first payment, so one wrong month shifts every later month of the recovery. The 7,200 rows (160 veterans over 45 months) sit at these boundaries: claims a few weeks either side of a year after separation, increases first shown a little more or a little less than a year before the claim, and combined values a little either side of a multiple of 5."
solution_explanation = "The reference solution fixes the effective date of every rating decision from 38 CFR 3.400(b)(2) for original claims and 3.400(o) for increases, and builds the combined rating on any day from the ratings in effect, combining with the 4.25 table and applying the 4.26 bilateral factor to compensable disabilities of both arms or both legs (limbs read from the description). It dates each dependent under 3.401(b), never earlier than the start of the award. It then walks the months from the first month payable under 3.31: each month is paid at the rating and dependents in effect at the end of the previous month, at the rate table in effect for the month, with additional amounts for dependents only at 30% or more, and the amount still owed for separation pay (gross less federal income tax withheld, 3.700(a)(5)) is withheld first."
verification_explanation = "The verifier recomputes every row with its own independently written engine (engine.py, which combines exactly with fractions and adds the bilateral factor exactly, reads limbs from the diagnostic codes and evaluates dated segments, while the reference solution uses the rounded combined ratings table and reads limbs from the descriptions) from a private copy of the inputs that exists only in the verifier image, and never runs agent code. The generator rejects any veteran whose answer would change between the rounded table and exact combination, so both readings agree on every row. The engine is checked against the 10 planted veterans worked by hand (golden.json, 450 rows), and the generator's own third implementation reproduces all 7,200 rows. Tests check that the inputs are consistent, the exact header, one row per veteran and month in order, the value format, the planted veterans, one test per rule family (effective dates and payment start, combined ratings and the bilateral factor, dependents, separation pay) and finally every row by exact match. Reward is 1 only if every test passes."
category = "Operations"
subcategory = "Claims"
tags = ["va", "38-cfr-part-4", "disability-compensation", "combined-ratings", "bilateral-factor", "claims", "python"]
expert_time_estimate_hours = 8
relevant_experience = "VA disability compensation claims and awards: effective dates, the combined ratings table and bilateral factor, dependency additions, rate tables and recovery of separation pay under 38 CFR Parts 3 and 4."

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[agent]
timeout_sec = 28800.0

