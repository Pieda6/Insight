artifacts = ["/app/output/"]

schema_version = "2.0"

[task]
name = "insight/va-compensation-awards"
description = "Audit a VA regional office's disability compensation awards: for 222 veterans and every month from January 2023 to September 2026, compute the combined disability rating each month is paid on and the compensation paid under 38 CFR Parts 3 and 4, across effective dates, reductions, temporary total ratings for hospital care and convalescence, the combined ratings table and bilateral factor, dependents, December rate changes and recovery of separation pay."

[metadata]
difficulty_explanation = "VA awards staff fix every monthly compensation payment from a veteran's whole claims history, and the provisions that decide it change each other. Effective dates come from 38 CFR 3.400(b)(2) and 3.400(o)(2) with the one-year limits counted under 3.110, reductions take effect under 3.105(e), and payment at a new rate starts on a different month than its effective date under 3.31, which makes temporary total ratings under 4.29 and 4.30 an increase with its own exception in 3.31(c)(5). 4.29 turns a hospital record into a total rating only through its rules on authorized absences, treatment that begins after admission and months of convalescence. The combined rating comes from Table I of 4.25, and the bilateral factor of 4.26 as amended in 2023 decides how disabilities of the arms and legs enter it, including the procedure for four extremities and the most favorable exclusion of bilateral disabilities in 4.26(d), so a new, increased or reduced rating on one limb can change the rating of the whole award. Additional amounts for dependents depend on the rating paid (3.4(b)(2)) and on when each marriage or birth was reported (3.401(b)), the rate tables change every December 1, and nondisability separation pay is recovered from compensation under 3.700(a)(5) from the first payment, so one wrong month shifts every later month of the recovery. The 9,990 rows (222 veterans over 45 months) are dense with boundaries: claims and reports on the last day of a one-year limit or the day after, absences of 4 or 5 days and totals of 8 or 9 days, absences of 14 or 15 days, and combined values a little either side of a multiple of 5."
solution_explanation = "The reference solution dates every rating decision from 38 CFR 3.400(b)(2) and 3.400(o) (one-year limits counted under 3.110) and every reduction from 3.105(e), and turns each hospital or convalescence record into a temporary total rating under 4.29 (authorized absences in (a)(1) and (a)(2), treatment beginning after admission in (b), convalescence in (e)) or 4.30. Each month is paid on the ratings payable for it under 3.31, including the exception in 3.31(c)(5), combined with Table I of 4.25 and the bilateral factor of 4.26, searching every exclusion allowed by 4.26(d) for the most favorable result. Dependents are dated under 3.401(b) and paid only at 30% or more, the rate table in effect for the month applies, and the separation pay still owed (gross less federal income tax withheld, 3.700(a)(5)) is withheld first."
verification_explanation = "The verifier recomputes every row with its own independently written engine (engine.py, which reads limbs from diagnostic codes, searches the 4.26(d) exclusions as bit masks, walks hospital absences day by day and reads each month from dated rating periods, while the reference solution reads limbs from descriptions and works by month indexes) from a private copy of the inputs that exists only in the verifier image, and never runs agent code. The generator, a third implementation, reproduces all 9,990 rows and rejects any veteran whose answer would depend on an open reading. The engine is checked against the 22 planted veterans worked by hand (golden.json, 990 rows). Tests check that the inputs are consistent, the exact header, one row per veteran and month in order, the value format, the planted veterans, one test per rule family (effective dates and payment start, combined ratings and the bilateral factor, dependents, separation pay, temporary total ratings, reductions, one-year limits) and finally every row by exact match. Reward is 1 only if every test passes."
category = "Operations"
subcategory = "Claims"
tags = ["va", "38-cfr-part-4", "disability-compensation", "combined-ratings", "bilateral-factor", "temporary-total-rating", "claims", "python"]
expert_time_estimate_hours = 8
relevant_experience = "VA disability compensation claims and awards: effective dates, reductions, temporary total ratings, the combined ratings table and bilateral factor, dependency additions, rate tables and recovery of separation pay under 38 CFR Parts 3 and 4."

