[task]
name = "insight/prostate-seed-dosimetry"
description = "Edema-corrected post-implant evaluation of 20 permanent prostate seed implants (iodine-125 and palladium-103, eight consensus seed models) under AAPM TG-43U1 with the reporting indices of AAPM TG-137: from CT seed markers (two per seed, or one where the orientation was lost), vendor certificates in air-kerma strength per seed, per batch or in apparent activity with the vendor's exposure-rate constant, calibration times with UTC offsets, New York local implant and CT times across the 2026 daylight-saving changes, duplicate detections, slice contours of prostate, urethra and rectum, and the prostate volumes before the implant, at the end of the procedure and on the CT, integrate the TG-43U1 2D line-source dose rate (1D with the Appendix C short-distance model for one-marker seeds) over time while the edematous prostate shrinks, and report prostate D90, V100 and V150, urethral D10 and D30, rectal V100 and D2cc and four acceptance criteria per patient."

