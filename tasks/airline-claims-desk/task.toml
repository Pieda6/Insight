artifacts = ["/app/output/"]

schema_version = "2.0"

[task]
name = "insight/airline-claims-desk"
description = "Settle an airline's passenger claim queue under 14 CFR Parts 250 and 260: denied boarding compensation, fare and ancillary-fee refunds for cancellations, significant changes, delayed bags and services not provided, and the date each refund is due."

[metadata]
difficulty_explanation = "Airline claims desks settle these from raw operational records, and every answer turns on regulation details few people know exactly, applied to times that must be reconstructed. Nothing is pre-classified: each flight has a schedule history whose versions apply from the moment they were recorded, every schedule time is a local wall time at its airport (IANA zone given) while events are UTC, and the queue spans the October 25 European and November 1 U.S. clock changes and Phoenix and Honolulu, which keep standard time. A significant change (Part 260, 2024) is judged on the whole itinerary as bought, against the itinerary offered in the final notice: departure from the origin 3 h (domestic) or 6 h (international) earlier, arrival at the destination 3 h or 6 h later, a different origin or destination airport, more connection points, or a lower class of service; a later departure, a later arrival at an intermediate point or a different connecting airport is not enough, changes accumulate across notices, and a schedule change made before purchase does not count. A cancellation of any flight in the itinerary qualifies; the consumer must not have accepted (silence is never acceptance, boarding the new flight is); the refund is the whole fare plus extras, otherwise only unused extras under 260.4, and nothing when a minor change is declined. The prompt-refund clock runs from the earliest date under 260.6(a)(2) or the passenger's own request: the rejection, the UTC day the offered itinerary departs, the day the cancelled flight (possibly a later leg) was to depart when a voucher offer went unanswered, or the cancellation when nothing was offered; then 7 business days with federal holidays for credit cards and 20 calendar days otherwise. A foreign-to-foreign leg after a foreign stopover over 24 hours is not a covered flight. Denied boarding compensation (Part 250) applies to scheduled flights from a U.S. airport on aircraft of 30 or more seats; check-in compliance is computed against the contract-of-carriage deadline (45 or 60 minutes) in local time; a passenger who accepts compensation after being bumped is still involuntary; operational substitutions, weight and balance on 60 seats or fewer and reseating at no charge excuse it; the band (1 h, 2 h domestic or 4 h international) uses the replacement's arrival as planned when it was arranged, not after later schedule changes, at the destination or first stopover (over 4 h), on the fare to that point, capped at $1,075 and $2,150; unused extras are refunded. Bag fees are refunded with a mishandled baggage report when delivery comes more than 12, 15 or 30 hours after the door opened at the final destination, the 15 or 30 hours depending on the scheduled duration of the longest U.S.-foreign nonstop. Reading wall clocks as UTC, using the latest schedule version, measuring a change from the previous notice or flight by flight, or measuring a bag delay from the scheduled arrival each gets many claims wrong. The data is synthetic but follows real routes, block times, aircraft and fares."
solution_explanation = "Convert every schedule and door time to UTC with its airport's zone and keep each flight's schedule versions with their recording times. Oversale: check Part 250 scope, volunteer status (accepting compensation after being bumped is not volunteering), the check-in deadline against the scheduled departure, and the 250.6 exceptions; find the destination or first stopover (gap over 4 h) from the schedule, take the fare through it (lowest cash fare in the cabin for award tickets), compare the replacement's arrival as scheduled when it was arranged with the original arrival there, and apply 200% or 400% with the caps; refund unused extras. Schedule change: take the original itinerary as scheduled at purchase and the final notice's offered itinerary as scheduled when that notice was sent; check the affected leg is a covered flight (break in journey); the itinerary changed significantly if any flight was cancelled or the whole-itinerary tests are met; if the passenger did not accept (decline or silence), refund all fares and extras from the earliest of the passenger's request and the 260.6(a)(2) date; if accepted, refund unused extras from the request; a declined minor change owes nothing. Bags: require a mishandled baggage report and no exemption; measure from the door opening to delivery against 12, 15 or 30 hours; refund the linked fee, the highest fee when not linked, or the non-subscriber fee for subscribers. Ancillary: refund services not provided unless the consumer was at fault. Due date: 7 business days after the start date for credit cards, skipping weekends and federal holidays, otherwise 20 calendar days."
verification_explanation = "The verifier recomputes every claim with its own independently written engine (engine.py, timezone-aware datetimes and schedule timelines, while the reference solution converts everything to integer UTC minutes) from a private copy of the inputs that exists only in the verifier image, and never runs agent code. The engine is itself checked against 104 hand-worked planted claims (golden.json). Tests check the exact header, one row per claim in input order, value formats, the hand-worked cases, one test per rule family (denied boarding bands and caps, fare base, exceptions and scope, unused fees, cancellations and significant changes, schedule history and whole itinerary, refund due dates, covered flights and break in journey, delayed and lost bags, ancillary services, local schedule times and daylight saving) and finally every row by exact match. All money is integer cents and all times whole minutes, so comparisons are exact. Reward is 1 only if every test passes."
category = "Operations"
subcategory = "Claims"
tags = ["airline", "claims", "14-cfr-250", "14-cfr-260", "denied-boarding", "refunds", "consumer-protection", "time-zones", "python"]
expert_time_estimate_hours = 8
relevant_experience = "Airline customer relations or claims operations: DOT oversales rules (14 CFR 250) and the 2024 refund rule (14 CFR 260), including denied boarding compensation, significant schedule changes, delayed baggage fee refunds and prompt refund deadlines."

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[agent]
timeout_sec = 28800.0

