artifacts = ["/app/output/"]

schema_version = "2.0"

[task]
name = "insight/airline-claims-desk"
description = "Settle an airline's passenger claim queue under 14 CFR Parts 250 and 260: denied boarding compensation, fare and ancillary-fee refunds for cancellations, significant changes, delayed bags and services not provided, and the date each refund is due."

[metadata]
difficulty_explanation = "Airline claims desks settle these every day, and each answer turns on regulation details few people know exactly. Denied boarding compensation (Part 250) applies only to scheduled segments on aircraft with 30 or more seats leaving a U.S. airport; the replacement's planned arrival at the first stopover (more than 4 hours) or destination decides the band, with 'not later than one hour', 'more than one hour but less than two (four for international) hours' and the rest, so exactly 1 h owes nothing and exactly 2 h owes 400%; the multiple applies to the fare to destination or first stopover including mandatory taxes but not optional fees, capped at the current $1,075 and $2,150; award tickets use the lowest cash fare in the same cabin on that flight; volunteers, standby passengers, check-in failures, operational smaller-aircraft substitutions, weight/balance limits on 60 or fewer seats and reseating in another section remove compensation, while unused ancillary fees are still refunded. Refunds (Part 260, 2024) require a cancellation or significant change (3 h domestic / 6 h international, earlier or later, airport change, extra connection, downgrade) and that the consumer not accept the alternative, where silence is never acceptance; bag fees are refunded only with a mishandled baggage report and past 12, 15 or 30 hours depending on the longest U.S.-foreign nonstop, with exemptions and rules for escalating fee scales and subscriptions; prompt refund means 7 business days for credit cards but 20 calendar days otherwise. Each shortcut gets most claims right and a planted set wrong. The data is synthetic but follows real routes, block times, aircraft and fares."
solution_explanation = "Classify each claim. Oversale: check Part 250 applicability (scheduled, 30+ seats, U.S. origin), confirmed space, volunteer status and the 250.6 exceptions; find the first stopover or destination from the coupon times, take the fare through it (or the lowest cash fare in the cabin for award tickets), measure the planned arrival of the alternate transportation there against the domestic or international bands, apply 200% or 400% with the caps; refund unused ancillary fees. Schedule change: decide whether it is a cancellation or significant change using the 3 h or 6 h thresholds and the other criteria, then refund the full fare plus ancillary fees if the consumer rejected or did not affirmatively accept the alternative; if they flew or accepted rebooking refund only services not provided. Bags: require an MBR and no exemption, compare the delivery delay with 12/15/30 hours, refund the fee for that bag, the highest fee when not linked, or the non-subscriber fee for subscribers. Ancillary: refund services not provided unless the consumer was at fault. Due date: 7 business days after the trigger date for credit cards, skipping weekends and federal holidays, otherwise 20 calendar days."
verification_explanation = "The verifier recomputes every claim with its own independently written engine (engine.py) from a private copy of the inputs that exists only in the verifier image, and never runs agent code. The engine is itself checked against 66 hand-worked planted claims (golden.json). Tests check the exact header, one row per claim in input order, value formats, the hand-worked cases, one test per rule family (denied boarding bands and caps, fare base, exceptions and scope, unused fees, cancellations and significant changes, refund due dates, delayed and lost bags, ancillary services) and finally every row by exact match. All money is integer cents and all times whole minutes, so comparisons are exact. Reward is 1 only if every test passes."
category = "Operations"
subcategory = "Claims"
tags = ["airline", "claims", "14-cfr-250", "14-cfr-260", "denied-boarding", "refunds", "consumer-protection", "python"]
expert_time_estimate_hours = 6
relevant_experience = "Airline customer relations or claims operations: DOT oversales rules (14 CFR 250) and the 2024 refund rule (14 CFR 260), including denied boarding compensation, significant schedule changes, delayed baggage fee refunds and prompt refund deadlines."

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[agent]
timeout_sec = 28800.0

