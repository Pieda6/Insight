artifacts = ["/app/output/"]

schema_version = "2.0"

[task]
name = "insight/medicare-inpatient-claims"
description = "Settle a hospital system's queue of Medicare Part A inpatient and skilled nursing facility claims under 42 CFR Part 409: benefit period, covered days, lifetime reserve days, inpatient deductible, daily coinsurance and blood deductible for every claim, from each beneficiary's full stay history."

[metadata]
difficulty_explanation = "Hospital patient financial services teams and Medicare administrative contractors work out Part A cost sharing for every inpatient claim, and every answer depends on the beneficiary's whole history, not on the stay alone. A benefit period ends only after 60 consecutive days in which the beneficiary was not an inpatient of a hospital or a skilled nursing facility at the skilled level, so the discharge day counts as a day out, custodial nursing-facility days do not keep a period open, and a readmission 59 days out is still the same period while 60 days out starts a new one with a new deductible. Within a period, hospital days 1 to 60 carry the deductible once, days 61 to 90 a daily coinsurance, then the 60 non-renewable lifetime reserve days at a higher rate are drawn on automatically; nursing-facility care needs a 3-day inpatient stay (discharge day and outpatient observation not counted) and admission within 30 days, and is limited to 100 days per period with coinsurance from day 21, never more than the facility's own daily charge (one facility charges between the 2025 and 2026 amounts); hospital days before entitlement still count toward the 3 days. Coinsurance uses the published amount for the calendar year of each day, so long stays crossing January 1 mix two rates, and a period that began in 2024 carries no new deductible in 2025. Psychiatric hospital care is limited to 190 days in a lifetime (psychiatric care in a general hospital is not), and a beneficiary already in a psychiatric hospital on the first day of entitlement has the days spent there in the previous 150 days subtracted from the psychiatric days available in the initial period only, counting general-hospital psychiatric days too. The blood deductible covers the first 3 units of whole blood or red cells in each calendar year, Part B units included and replaced units still counted. The histories span up to ten years and 2,483 stays, with many cases a day either side of each limit. The data is synthetic but follows real stay patterns."
solution_explanation = "For each beneficiary, walk the calendar from the first day of entitlement. Mark hospital inpatient days (admission day up to the day before discharge) and nursing-facility days at the skilled level; a period starts on the first such day when none is open and ends after 60 consecutive days without one. Pay hospital days in order: 60 full days, 30 coinsurance days, then lifetime reserve days while any remain, skipping psychiatric hospital days once 190 have been paid and, in the initial period of a beneficiary entitled while in a psychiatric hospital, psychiatric days beyond 150 minus the days spent there in the 150 days before entitlement. Charge the deductible on the first paid hospital day of each period at that year's amount, and coinsurance at the amount for each day's year. A nursing-facility stay is paid only if the hospital or critical access hospital stay before it lasted 3 days from the inpatient admission date and the admission came within 30 days, for skilled days only, up to 100 per period, with coinsurance from day 21 at the lower of that year's amount and the facility's daily charge; the 3 days count from the inpatient admission date even if it came before entitlement, provided the discharge came in or after the month of the 65th birthday. Count whole blood and red-cell units per calendar year across Part A and Part B in date order; the first 3 are the beneficiary's unless replaced."
verification_explanation = "The verifier recomputes every claim with its own independently written engine (engine.py: benefit periods from merged inpatient intervals and stays priced in blocks of days, while the reference solution walks the calendar one day at a time) from a private copy of the inputs that exists only in the verifier image, and never runs agent code. The engine is checked against 65 hand-worked planted claims (golden.json), and the generator's own third implementation re-checks the same answers. Tests check the exact header, one row per claim in input order, value formats, the hand-worked claims, one test per rule family (benefit periods, hospital days and coinsurance, lifetime reserve days, amounts by calendar year, history before the queue, skilled nursing facility, psychiatric limits, entitlement, blood deductible) and finally every row by exact match. Days are whole numbers and money is integer cents, so comparisons are exact. 37 shortcut solutions each fail at least one test. Reward is 1 only if every test passes."
category = "Operations"
subcategory = "Claims"
tags = ["medicare", "part-a", "42-cfr-409", "claims", "benefit-period", "coinsurance", "skilled-nursing", "healthcare-billing", "python"]
expert_time_estimate_hours = 8
relevant_experience = "Hospital patient financial services or Medicare contractor claims work: Part A benefit periods, inpatient and SNF day counting, lifetime reserve and psychiatric limits, deductible, coinsurance and blood deductible under 42 CFR 409."

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

