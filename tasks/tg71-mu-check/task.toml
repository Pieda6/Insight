artifacts = ["/app/output/"]

schema_version = "2.0"

[task]
name = "insight/tg71-mu-check"
description = "Independent monitor unit check under AAPM TG-71 (Med Phys 2014;41:031501) for 91 beams of 33 treatment plans on a Varian Clinac 21EX: 6 MV photon beams at isocentric and fixed-SSD setups with asymmetric jaws, tertiary MLC and cerrobend blocks on a tray, physical wedges, off-axis and off-isocenter points and lung corrections, and 9 MeV electron beams with rectangular inserts at extended distances, from the commissioning tables of the report."

[metadata]
difficulty_explanation = "Each photon beam's MU is a product of 8 to 10 table lookups (Sc, Sp, TPR or PDDN, wedge, tray, off-axis and heterogeneity factors), and TG-71 gives each factor its own field size and distance: the jaw field for Sc with a tertiary MLC or tray blocks, the patient-incident field projected to the point's depth for Sp, TPR and wedge, the normalization depth for Sp in the PDD formalism, PDDN converted from SSD 100 cm by the Mayneord factor, D0 at SSD0 90 cm, off-axis distances projected to 100 cm, RTAR or power-law lung corrections. Electron beams need the square-root rule for rectangular inserts and the effective SSD or air gap method at extended distance. One wrong field size or distance moves an MU by about 1 percent against a 0.3 percent tolerance, across 91 beams, and nothing in the data lets a solver check its own answers."
solution_explanation = "Eq. (1) of TG-71 for every photon beam with the field size of Sec. 2.A.2 for each factor, linear interpolation in the report's 6 MV tables, Eqs. (6) to (8) for heterogeneities; Eqs. (10) to (13) and (22) for 9 MeV electrons."
verification_explanation = "An independent engine, checked against the six worked examples of TG-71 Section 8, recomputes every beam from a private copy of the inputs; an MU is accepted within 0.3 percent of any MU the protocol allows for that beam (Eq. (1) or Eq. (3), Eq. (14) with or without its bracket, wedge field at depth or isocenter, either geometric mean for SSDeff)."
domain = "Science"
field = "Medicine"
subfield = "Radiation Oncology and Medical Physics"
tags = ["radiation-oncology", "medical-physics", "monitor-units", "tg-71", "linac", "dosimetry", "python"]
expert_time_estimate_hours = 7
relevant_experience = "Clinical medical physics: independent monitor unit verification of external beam treatment plans under AAPM TG-71, with photon and electron commissioning data (PDD, TPR, Sc, Sp, off-axis ratios, wedge and tray factors, electron output factors, effective SSD and air gap factors)."

[verifier]
